<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>October 7</title>
<link rel="icon" href="data:,">
<style>
  :root{--u:1px;--ink:#f3efe8;--mute:#a8b0bd;--gold:#ffd166;--rose:#ff9db8;--accent:#ff8a3d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#07080b;color:var(--ink);overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;user-select:none}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000;box-shadow:0 0 0 1px #20242c,0 30px 90px #000}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .layer{position:absolute;inset:0;pointer-events:none}
  /* dialogue */
  #dlg{position:absolute;left:calc(var(--u)*60);right:calc(var(--u)*60);bottom:calc(var(--u)*26);min-height:calc(var(--u)*150);
    background:linear-gradient(180deg,rgba(16,18,26,.86),rgba(10,11,16,.92));border:calc(var(--u)*1.5) solid rgba(255,255,255,.14);border-radius:calc(var(--u)*18);
    padding:calc(var(--u)*18) calc(var(--u)*28) calc(var(--u)*18) calc(var(--u)*140);display:none;backdrop-filter:blur(6px);pointer-events:auto;cursor:pointer;
    box-shadow:0 calc(var(--u)*12) calc(var(--u)*40) rgba(0,0,0,.55)}
  #dlg.on{display:block;animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(calc(var(--u)*14));opacity:0}to{transform:none;opacity:1}}
  #portw{position:absolute;left:calc(var(--u)*22);top:calc(var(--u)*-30);width:calc(var(--u)*104);height:calc(var(--u)*104);border-radius:50%;overflow:hidden;
    border:calc(var(--u)*3) solid var(--pc,#fff);background:#1b1f2a;box-shadow:0 calc(var(--u)*6) calc(var(--u)*18) rgba(0,0,0,.6)}
  #port{width:100%;height:100%;display:block}
  #who{font-weight:700;letter-spacing:calc(var(--u)*2);font-size:calc(var(--u)*17);color:var(--pc,#fff);margin-bottom:calc(var(--u)*6);text-transform:uppercase}
  #txt{font-size:calc(var(--u)*25);line-height:1.42;min-height:calc(var(--u)*72);color:var(--ink)}
  #txt.nar{font-style:italic;color:#d8d2c4;font-family:Georgia,"Times New Roman",serif}
  #more{position:absolute;right:calc(var(--u)*22);bottom:calc(var(--u)*10);font-size:calc(var(--u)*20);color:var(--gold);animation:bob 1s infinite}
  @keyframes bob{50%{transform:translateY(calc(var(--u)*5))}}
  /* choices */
  #choices{position:absolute;left:50%;bottom:calc(var(--u)*34);transform:translateX(-50%);width:calc(var(--u)*880);display:none;flex-direction:column;gap:calc(var(--u)*10);pointer-events:auto}
  #choices.on{display:flex;animation:rise .25s ease-out}
  #cprompt{text-align:center;font-size:calc(var(--u)*26);color:var(--ink);text-shadow:0 2px 12px #000;margin-bottom:calc(var(--u)*4);font-family:Georgia,serif}
  .cbtn{font:inherit;font-size:calc(var(--u)*22);color:var(--ink);text-align:left;padding:calc(var(--u)*14) calc(var(--u)*22);border-radius:calc(var(--u)*14);cursor:pointer;
    background:linear-gradient(180deg,rgba(28,32,44,.92),rgba(16,18,26,.94));border:calc(var(--u)*1.5) solid rgba(255,255,255,.18);transition:.15s}
  .cbtn:hover,.cbtn:focus{border-color:var(--accent);transform:translateX(calc(var(--u)*6));outline:none;background:linear-gradient(180deg,rgba(60,38,28,.95),rgba(30,18,14,.96))}
  .cbtn small{display:block;color:var(--mute);font-size:calc(var(--u)*16);margin-top:calc(var(--u)*3)}
  .cbtn kbd{display:inline-block;min-width:calc(var(--u)*26);text-align:center;margin-right:calc(var(--u)*12);padding:0 calc(var(--u)*6);border-radius:calc(var(--u)*6);background:#2a3040;color:var(--gold);font-size:calc(var(--u)*17)}
  /* HUD */
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(var(--u)*16) calc(var(--u)*22);pointer-events:none}
  #clock{font-size:calc(var(--u)*34);font-weight:700;letter-spacing:calc(var(--u)*2);text-shadow:0 2px 14px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
  #chap{font-size:calc(var(--u)*15);color:var(--mute);letter-spacing:calc(var(--u)*2);text-transform:uppercase;text-shadow:0 2px 10px #000}
  #hbtns{display:flex;gap:calc(var(--u)*8);pointer-events:auto}
  .hb{font:inherit;font-size:calc(var(--u)*16);color:var(--ink);background:rgba(10,12,18,.65);border:1px solid rgba(255,255,255,.18);border-radius:calc(var(--u)*10);padding:calc(var(--u)*6) calc(var(--u)*12);cursor:pointer}
  .hb:hover{border-color:var(--accent)}
  #hint{position:absolute;left:50%;top:calc(var(--u)*76);transform:translateX(-50%);font-size:calc(var(--u)*20);color:var(--ink);background:rgba(10,12,18,.72);border:1px solid rgba(255,255,255,.16);padding:calc(var(--u)*8) calc(var(--u)*18);border-radius:calc(var(--u)*30);display:none;pointer-events:none;white-space:nowrap}
  #hint.on{display:block}
  /* chapter card */
  #card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 45%,#1a1e2b,#05060a 75%);text-align:center;pointer-events:auto;cursor:pointer}
  #card.on{display:flex;animation:fadein .6s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  #card .k{color:var(--accent);letter-spacing:calc(var(--u)*8);font-size:calc(var(--u)*20);text-transform:uppercase}
  #card h1{font-family:Georgia,serif;font-weight:400;font-size:calc(var(--u)*78);margin:calc(var(--u)*14) 0;letter-spacing:calc(var(--u)*3)}
  #card .t{color:var(--mute);font-size:calc(var(--u)*24);font-family:Georgia,serif;font-style:italic}
  #toast{position:absolute;left:50%;top:calc(var(--u)*130);transform:translateX(-50%);background:rgba(10,12,18,.85);border:1px solid var(--accent);border-radius:calc(var(--u)*30);padding:calc(var(--u)*10) calc(var(--u)*22);font-size:calc(var(--u)*22);display:none;pointer-events:none}
  #toast.on{display:block;animation:rise .25s}
  /* mini UI */
  #mini{position:absolute;inset:0;pointer-events:none}
  #mini>*{pointer-events:auto}
  .panel{position:absolute;background:linear-gradient(180deg,rgba(22,26,36,.94),rgba(12,14,20,.96));border:calc(var(--u)*1.5) solid rgba(255,255,255,.18);border-radius:calc(var(--u)*18);padding:calc(var(--u)*20) calc(var(--u)*26);box-shadow:0 calc(var(--u)*20) calc(var(--u)*60) rgba(0,0,0,.6)}
  .panel h3{margin:0 0 calc(var(--u)*10);font-family:Georgia,serif;font-weight:400;font-size:calc(var(--u)*30)}
  .panel p{margin:calc(var(--u)*6) 0;font-size:calc(var(--u)*20);color:#d6dae3}
  .panel input{font:inherit;font-size:calc(var(--u)*28);width:100%;padding:calc(var(--u)*12) calc(var(--u)*16);border-radius:calc(var(--u)*12);border:calc(var(--u)*2) solid #3a4254;background:#0e1118;color:var(--ink);outline:none}
  .panel input:focus{border-color:var(--accent)}
  .row{display:flex;gap:calc(var(--u)*12);flex-wrap:wrap;margin-top:calc(var(--u)*14)}
  .btn{font:inherit;font-size:calc(var(--u)*21);color:var(--ink);padding:calc(var(--u)*12) calc(var(--u)*22);border-radius:calc(var(--u)*12);cursor:pointer;background:#252b3a;border:calc(var(--u)*1.5) solid rgba(255,255,255,.16)}
  .btn:hover{border-color:var(--accent)}
  .btn.p{background:var(--accent);border-color:var(--accent);color:#1a0f08;font-weight:700}
  .btn[disabled]{opacity:.35;cursor:not-allowed}
  .bar{height:calc(var(--u)*18);border-radius:calc(var(--u)*10);background:#1a1f2b;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a3d,#ffd166);transition:width .12s linear}
  .cap{font-size:calc(var(--u)*20);color:var(--mute);margin-top:calc(var(--u)*8);font-style:italic;min-height:calc(var(--u)*28)}
  .grid{display:grid;gap:calc(var(--u)*12)}
  #title{position:absolute;inset:0;display:none}
  /* title screen */
  #menu{position:absolute;left:calc(var(--u)*90);bottom:calc(var(--u)*90);display:flex;flex-direction:column;gap:calc(var(--u)*12);width:calc(var(--u)*380)}
  #menu .btn{font-size:calc(var(--u)*26);text-align:left;background:rgba(14,16,24,.7)}
  #menu .btn.p{background:var(--accent);color:#1a0f08}
  #chsel{position:absolute;right:calc(var(--u)*70);top:calc(var(--u)*120);width:calc(var(--u)*460);display:none}
  #chsel.on{display:block}
  #chsel .btn{display:block;width:100%;text-align:left;margin-bottom:calc(var(--u)*8);font-size:calc(var(--u)*20)}
  #rot{display:none;position:fixed;inset:0;background:#07080b;z-index:20;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
  @media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="mini"></div>
  <div id="hud"><div><div id="clock"></div><div id="chap"></div></div><div id="hbtns"><button class="hb" id="bMute">♪ On</button><button class="hb" id="bMenu">Menu</button><a class="hb" href="index.html" style="text-decoration:none">Office map</a></div></div>
  <div id="hint"></div><div id="toast"></div>
  <div id="choices"><div id="cprompt"></div><div id="clist" style="display:flex;flex-direction:column;gap:inherit"></div></div>
  <div id="dlg"><div id="portw"><canvas id="port" width="208" height="208"></canvas></div><div id="who"></div><div id="txt"></div><div id="more">▶</div></div>
  <div id="card"><div class="k" id="ck"></div><h1 id="ch"></h1><div class="t" id="ct"></div></div>
</div>
<div id="rot">Please rotate your phone to landscape for the best experience.</div>
<script src="game/engine.js"></script>
<script src="game/art.js"></script>
<script src="game/s_office.js"></script>
<script src="game/sprites.js"></script>
<script src="game/s_map.js"></script>
<script src="game/s_outdoor.js"></script>
<script src="game/s_top.js"></script>
<script src="game/s_ride.js"></script>
<script src="game/s_end.js"></script>
<script src="game/story.js"></script>
</body>
</html>
