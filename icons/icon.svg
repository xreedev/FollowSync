      <rect x="112" y="284" width="30" height="22" rx="3" fill="#6b78b8" opacity=".55"/><rect x="156" y="284" width="30" height="22" rx="3"/><rect x="200" y="284" width="30" height="22" rx="3"/><rect x="282" y="284" width="30" height="22" rx="3"/><rect x="326" y="284" width="30" height="22" rx="3" fill="#6b78b8" opacity=".55"/><rect x="370" y="284" width="30" height="22" rx="3"/>
