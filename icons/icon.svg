<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/><stop offset=".5" stop-color="#3a2a5c"/><stop offset=".82" stop-color="#e8765a"/><stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2c8"/><stop offset=".45" stop-color="#ffb26b"/><stop offset="1" stop-color="#ffb26b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
